<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yaroofie</title>
<link rel="icon" href="/favicon.ico">
<link rel="canonical" href="https://yaroofie.github.io/en/">
<link rel="alternate" hreflang="en" href="https://yaroofie.github.io/en/">
<link rel="alternate" hreflang="fa" href="https://yaroofie.github.io/fa/">
<link rel="alternate" hreflang="de" href="https://yaroofie.github.io/de/">
<link rel="alternate" hreflang="x-default" href="https://yaroofie.github.io/en/">
<style>
  html, body { height: 100%; margin: 0; background: #05060f; color: #e6e6f0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  a { color: #7c9cff; }
</style>
<script>
(function () {
  var supported = ['en', 'fa', 'de'];
  var chosen = null;

  // Remember the language picked on a previous visit (Nuxt i18n cookie).
  try {
    var match = document.cookie.match(/(?:^|;\s*)i18n_redirected=([^;]+)/);
    if (match && supported.indexOf(match[1]) !== -1) { chosen = match[1]; }
  } catch (e) {}

  // Otherwise use the browser language.
  if (!chosen) {
    var langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < langs.length; i++) {
      var code = String(langs[i]).toLowerCase().split('-')[0];
      if (supported.indexOf(code) !== -1) { chosen = code; break; }
    }
  }

  if (!chosen) { chosen = 'en'; }
  location.replace('/' + chosen + '/');
})();
</script>
</head>
<body>
  <noscript>
    <p>Choose a language: <a href="/en/">English</a> · <a href="/fa/">فارسی</a> · <a href="/de/">Deutsch</a></p>
  </noscript>
</body>
</html>
